[project]
name = "process-doctor"
version = "0.1.0"
description = "Watches every com.localfirst.* LaunchAgent for the launchd-stuck signature (near-zero CPU growth while still running) and kills, logs, and notifies on a hang."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "click<8.3.2",  # 8.3.2 breaks typer 0.24.1's option parsing: AttributeError 'bool' object has no attribute 'isidentifier'. Unpin once a compatible typer release lands.
    "rich>=14.3.3",
    "local-first-common",
]

[project.scripts]
process-doctor = "process_doctor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_doctor"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
local-first-common = { git = "https://github.com/jamalhansen/local-first-common.git", branch = "main" }

[tool.pytest.ini_options]
pythonpath = ["src"]
